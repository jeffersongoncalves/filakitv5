# Standard Dependabot config (dependabot-std).
# Weekly, grouped, 7-day cooldown (time to catch a malicious release).
# Filament majors are ignored so no branch ever gets a cross-major bump: main = Filament 5.

version: 2

updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: filament/*
        update-types:
          - version-update:semver-major
    groups:
      composer-deps:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
    groups:
      npm-deps:
        patterns:
          - '*'
