# Standard Dependabot config (dependabot-std).
# Weekly, grouped, 7-day cooldown (time to catch a malicious release).
# Framework majors are ignored so no branch ever gets a cross-major bump: main = Filament 5.
# Explicit `versions` ranges, not `update-types`: without a composer.lock Dependabot skips update-types.

version: 2

updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: filament/*
        versions:
          - '>=6.0'
      - dependency-name: jeffersongoncalves/filament-additional-information
        versions:
          - '>=4.0'
      - dependency-name: jeffersongoncalves/filament-logo
        versions:
          - '>=4.0'
      - dependency-name: jeffersongoncalves/filament-pwa
        versions:
          - '>=4.0'
      - dependency-name: jeffersongoncalves/filament-sensible-defaults
        versions:
          - '>=4.0'
    groups:
      composer-deps:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: tailwindcss
        versions:
          - '>=5.0'
    groups:
      npm-deps:
        patterns:
          - '*'
